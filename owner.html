<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>OUR LITTLE DATE · ответы</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

<body>
  <main class="shell owner-shell">
    <header class="top"><span class="brand-mark">♡</span><span>OUR LITTLE DATE</span><span class="top-note">your little inbox</span></header>

      <div class="eyebrow">JUST FOR YOU</div>
      <h1>Твои <em>ответы</em></h1>

      <button class="primary secondary hidden" id="copy-all-button" type="button">Скопировать все ответы текстом</button>
      <button class="primary secondary hidden" id="clear-button" type="button">Очистить список</button>
